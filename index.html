<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KSL Season 3 Points Table</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    width: 95%;
    margin: auto;
}

h1 {
    margin: 20px;
}

select, input, button {
    padding: 10px;
    margin: 8px;
    font-size: 16px;
    border-radius: 5px;
}

button {
    background: #22c55e;
    border: none;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.8;
}

.reset-btn {
    background: red;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border: 1px solid #334155;
}

th {
    background: #1e293b;
}

tr:nth-child(even) {
    background: #1e293b;
}

.popup {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #22c55e;
    padding: 20px 30px;
    font-size: 20px;
    display: none;
    border-radius: 8px;
}

</style>
</head>

<body>

<div class="container">

<h1>🏆 KSL Season 3 Dashboard</h1>

<!-- Match Entry -->
<select id="teamA"></select>
<select id="teamB"></select>

<input type="number" id="scoreA" placeholder="Team A Score">
<input type="number" id="scoreB" placeholder="Team B Score">

<br>

<button onclick="submitMatch()">Submit Match</button>
<button onclick="printTable()">Print / Save</button>
<button onclick="resetDashboard()" class="reset-btn">Reset Dashboard</button>

<!-- Points Table -->
<table>
<thead>
<tr>
<th>Team</th>
<th>M</th>
<th>W</th>
<th>L</th>
<th>Pts</th>
<th>For</th>
<th>Against</th>
<th>Diff</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<!-- Popup -->
<div class="popup" id="popup"></div>

<script>

const teams = [
"माऊली वॉरियर्स",
"राजमुद्रा वॉरियर्स",
"रौद्रशंभू योद्धाज",
"सह्याद्री फायटर्स",
"शिवमुद्रा वॉरियर्स",
"स्वराज्य वॉरियर्स"
];

let data = JSON.parse(localStorage.getItem("kslData")) || {};

function init() {

    teamA.innerHTML = "";
    teamB.innerHTML = "";

    teams.forEach(team => {

        if (!data[team]) {
            data[team] = {
                matches:0,
                wins:0,
                loss:0,
                points:0,
                for:0,
                against:0
            };
        }

        teamA.innerHTML += `<option>${team}</option>`;
        teamB.innerHTML += `<option>${team}</option>`;
    });

    localStorage.setItem("kslData", JSON.stringify(data));
    updateTable();
}

function submitMatch() {

    let A = teamA.value;
    let B = teamB.value;
    let sA = parseInt(scoreA.value);
    let sB = parseInt(scoreB.value);

    if (A === B) {
        alert("Select different teams!");
        return;
    }

    if (isNaN(sA) || isNaN(sB)) {
        alert("Enter valid scores!");
        return;
    }

    data[A].matches++;
    data[B].matches++;

    data[A].for += sA;
    data[A].against += sB;

    data[B].for += sB;
    data[B].against += sA;

    let resultText = "";

    if (sA > sB) {
        data[A].wins++;
        data[B].loss++;
        data[A].points += 2;
        resultText = `${A} won by ${sA - sB} points`;
    } else if (sB > sA) {
        data[B].wins++;
        data[A].loss++;
        data[B].points += 2;
        resultText = `${B} won by ${sB - sA} points`;
    } else {
        resultText = "Match Draw";
    }

    localStorage.setItem("kslData", JSON.stringify(data));

    showPopup(resultText);
    updateTable();

    // clear inputs
    scoreA.value = "";
    scoreB.value = "";
}

function updateTable() {

    let sorted = Object.entries(data).sort((a,b)=>{
        let pDiff = b[1].points - a[1].points;
        if (pDiff !== 0) return pDiff;

        let diffA = a[1].for - a[1].against;
        let diffB = b[1].for - b[1].against;
        return diffB - diffA;
    });

    tableBody.innerHTML = "";

    sorted.forEach(([team, d])=>{

        let diff = d.for - d.against;

        tableBody.innerHTML += `
        <tr>
        <td>${team}</td>
        <td>${d.matches}</td>
        <td>${d.wins}</td>
        <td>${d.loss}</td>
        <td>${d.points}</td>
        <td>${d.for}</td>
        <td>${d.against}</td>
        <td>${diff}</td>
        </tr>`;
    });
}

function showPopup(text) {

    popup.innerText = text;
    popup.style.display = "block";

    setTimeout(()=>{
        popup.style.display = "none";
    }, 2000);
}

function printTable() {
    window.print();
}

function resetDashboard() {

    let confirmReset = confirm("Are you sure you want to reset the tournament?");

    if (confirmReset) {

        localStorage.removeItem("kslData");

        data = {};

        teams.forEach(team => {
            data[team] = {
                matches:0,
                wins:0,
                loss:0,
                points:0,
                for:0,
                against:0
            };
        });

        localStorage.setItem("kslData", JSON.stringify(data));

        updateTable();

        showPopup("Dashboard Reset Successfully");
    }
}

init();

</script>

</body>
</html>
